<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Тело персонажа (броня) -->
  <defs>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff6b00;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Аура -->
  <circle cx="32" cy="32" r="28" fill="url(#glowGrad)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ноги -->
  <ellipse cx="24" cy="52" rx="6" ry="8" fill="#2d4a6f"/>
  <ellipse cx="40" cy="52" rx="6" ry="8" fill="#2d4a6f"/>
  
  <!-- Броня (тело) -->
  <ellipse cx="32" cy="36" rx="18" ry="20" fill="url(#armorGrad)"/>
  <ellipse cx="32" cy="32" rx="14" ry="14" fill="#5ba3d9"/>
  
  <!-- Плечи -->
  <circle cx="18" cy="32" r="8" fill="#3d6a9f"/>
  <circle cx="46" cy="32" r="8" fill="#3d6a9f"/>
  
  <!-- Голова/шлем -->
  <ellipse cx="32" cy="20" rx="12" ry="14" fill="#5ba3d9"/>
  <ellipse cx="32" cy="18" rx="10" ry="10" fill="#4a90d9"/>
  
  <!-- Глаза (светящиеся) -->
  <ellipse cx="27" cy="17" rx="3" ry="4" fill="#00ff88"/>
  <ellipse cx="37" cy="17" rx="3" ry="4" fill="#00ff88"/>
  <ellipse cx="27" cy="17" rx="1.5" ry="2" fill="#ffffff"/>
  <ellipse cx="37" cy="17" rx="1.5" ry="2" fill="#ffffff"/>
  
  <!-- Детали брони -->
  <rect x="28" y="28" width="8" height="16" fill="#2d5a8f" rx="2"/>
  <circle cx="32" cy="36" r="4" fill="#ffd700"/>
  
  <!-- Руки/перчатки -->
  <ellipse cx="16" cy="40" rx="6" ry="8" fill="#4a7aaf"/>
  <ellipse cx="48" cy="40" rx="6" ry="8" fill="#4a7aaf"/>
</svg>